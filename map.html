<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>四方地图</title>

<style>
  :root {
    --ink: #241f1b;
    --deep: #2e201d;
    --cinnabar: #883a1e;
    --green: #315444;
    --paper: #efe6d3;
    --line: rgba(36, 31, 27, 0.34);
    --muted: rgba(36, 31, 27, 0.68);
    --shadow: 0 18px 42px rgba(36,31,27,0.16);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    min-height: 100vh;
    padding: 28px;
    background:
      radial-gradient(circle at 18% 12%, rgba(136,58,30,0.10), transparent 26rem),
      linear-gradient(135deg, #efe6d3 0%, #d9c8ad 100%);
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    color: var(--ink);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(70, 52, 35, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70, 52, 35, 0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.72;
    z-index: -1;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .map-page {
    width: min(1120px, calc(100% - 24px));
    margin: 0 auto;
    padding: 20px 0 54px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .eyebrow {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--cinnabar);
    letter-spacing: 0.22em;
    font-size: 12px;
    font-weight: 700;
  }

  h1 {
    font-size: clamp(32px, 5vw, 54px);
    line-height: 1.1;
    letter-spacing: 0.16em;
    color: var(--deep);
    font-weight: 800;
  }

  h1::after {
    content: "";
    display: block;
    width: 72px;
    height: 2px;
    margin-top: 14px;
    background: linear-gradient(90deg, var(--cinnabar), transparent);
    opacity: 0.55;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .map-btn,
  .home-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 13px;
    border: 1px solid rgba(36,31,27,0.28);
    background: rgba(239,232,216,0.72);
    color: rgba(36,31,27,0.82);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: 0.18s ease;
  }

  .map-btn:hover,
  .home-link:hover {
    background: rgba(136,58,30,0.10);
    color: var(--cinnabar);
    transform: translateY(-1px);
  }

  .map-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 18px;
    align-items: start;
  }

  .map-shell {
    border: 1px solid rgba(36,31,27,0.34);
    background:
      linear-gradient(180deg, rgba(244,238,224,0.78), rgba(228,216,194,0.72));
    box-shadow: var(--shadow);
    padding: 14px;
    position: relative;
  }

  .map-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid rgba(36,31,27,0.34);
    background: rgba(239,232,216,0.62);
  }

  .map-stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background:
      linear-gradient(rgba(70, 52, 35, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70, 52, 35, 0.035) 1px, transparent 1px);
    background-size: 18px 18px;
    mix-blend-mode: multiply;
    opacity: 0.35;
  }

  .map-layer {
    position: absolute;
    inset: 0;
    transform-origin: center center;
    transition:
      transform 0.78s cubic-bezier(.2,.75,.2,1),
      opacity 0.28s ease,
      filter 0.28s ease;
  }

  .map-layer.fading {
    opacity: 0;
  }

  .map-layer.zooming {
    filter: blur(0.7px);
  }

  .map-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
  }

  .points-layer {
    position: absolute;
    inset: 0;
    z-index: 6;
  }

  .map-point {
    position: absolute;
    left: calc(var(--x) * 1%);
    top: calc(var(--y) * 1%);
    transform: translate(-50%, -50%);
    z-index: 20;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: "Songti SC", "STSong", serif;
  }

  .map-point:hover,
  .map-point:focus-visible,
  .map-point.selected {
    z-index: 40;
  }

  .map-point.has-bubble:hover,
  .map-point.has-bubble:focus-visible,
  .map-point.has-bubble.selected {
    z-index: 200;
  }

  .map-point::before {
    content: "";
    display: block;
    position: relative;
    z-index: 5;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid rgba(239,232,216,0.94);
    box-shadow: 0 0 0 5px rgba(49,84,68,0.16);
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, border-radius 0.2s ease;
  }

  .map-point.enter::before {
    width: 19px;
    height: 19px;
    border-radius: 4px;
    background: #9d2418;
    border-color: rgba(255,244,224,0.96);
    box-shadow:
      0 0 0 5px rgba(157,36,24,0.18),
      0 0 24px rgba(157,36,24,0.36);
    transform: rotate(45deg);
  }

  .map-point:hover::before,
  .map-point:focus-visible::before,
  .map-point.selected::before {
    transform: scale(1.26);
    background: #3f6c58;
    box-shadow:
      0 0 0 6px rgba(49,84,68,0.22),
      0 0 28px rgba(49,84,68,0.34);
  }

  .map-point.enter:hover::before,
  .map-point.enter:focus-visible::before,
  .map-point.enter.selected::before {
    transform: rotate(45deg) scale(1.26);
    background: #b24a28;
    box-shadow:
      0 0 0 6px rgba(157,36,24,0.22),
      0 0 28px rgba(157,36,24,0.34);
  }

  .map-label {
    position: absolute;
    left: 50%;
    top: -36px;
    transform: translateX(-50%);
    z-index: 6;
    white-space: nowrap;
    padding: 4px 9px;
    border: 1px solid rgba(36,31,27,0.28);
    background: rgba(239,232,216,0.92);
    color: #241f1b;
    font-size: 14px;
    letter-spacing: 0.12em;
    opacity: 1;
    pointer-events: none;
    transition: 0.2s ease;
    box-shadow: 0 4px 12px rgba(36,31,27,0.10);
  }

  .map-point:hover .map-label,
  .map-point:focus-visible .map-label,
  .map-point.selected .map-label {
    top: -40px;
    color: var(--cinnabar);
  }

  .point-bubble {
    position: absolute;
    left: 34px;
    bottom: -15px;
    width: 210px;
    padding: 7px;
    border: 1px solid rgba(36,31,27,0.32);
    background: rgba(248,240,222,0.96);
    box-shadow:
      0 18px 34px rgba(36,31,27,0.22),
      0 0 0 4px rgba(239,232,216,0.32);
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px) scale(0.98);
    transition: 0.2s ease;
    pointer-events: none;
    z-index: 100;
  }

  .point-bubble.bubble-left {
    left: auto;
    right: 34px;
    bottom: -15px;
  }

  .point-bubble::after {
    content: "";
    position: absolute;
    left: -7px;
    bottom: 18px;
    width: 12px;
    height: 12px;
    background: rgba(248,240,222,0.96);
    border-left: 1px solid rgba(36,31,27,0.32);
    border-bottom: 1px solid rgba(36,31,27,0.32);
    transform: rotate(45deg);
  }

  .point-bubble.bubble-left::after {
    left: auto;
    right: -7px;
    bottom: 18px;
    border-left: none;
    border-bottom: none;
    border-right: 1px solid rgba(36,31,27,0.32);
    border-top: 1px solid rgba(36,31,27,0.32);
  }

  .point-bubble img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid rgba(36,31,27,0.18);
    background: rgba(239,232,216,0.74);
  }

  .map-point:hover .point-bubble,
  .map-point:focus-visible .point-bubble,
  .map-point.selected .point-bubble {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  .map-page.view-huai .map-label,
  .map-page.view-yan .map-label,
  .map-page.view-shuo .map-label,
  .map-page.view-zhushan .map-label,
  .map-page.view-huaijun .map-label,
  .map-page.view-huaiwangfu .map-label,
  .map-page.view-zhangshiyuan .map-label {
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 2px 5px;
    top: -26px;
  }

  .map-page.view-huai .map-point:hover .map-label,
  .map-page.view-huai .map-point:focus-visible .map-label,
  .map-page.view-huai .map-point.selected .map-label,
  .map-page.view-yan .map-point:hover .map-label,
  .map-page.view-yan .map-point:focus-visible .map-label,
  .map-page.view-yan .map-point.selected .map-label,
  .map-page.view-shuo .map-point:hover .map-label,
  .map-page.view-shuo .map-point:focus-visible .map-label,
  .map-page.view-shuo .map-point.selected .map-label,
  .map-page.view-zhushan .map-point:hover .map-label,
  .map-page.view-zhushan .map-point:focus-visible .map-label,
  .map-page.view-zhushan .map-point.selected .map-label,
  .map-page.view-huaijun .map-point:hover .map-label,
  .map-page.view-huaijun .map-point:focus-visible .map-label,
  .map-page.view-huaijun .map-point.selected .map-label,
  .map-page.view-huaiwangfu .map-point:hover .map-label,
  .map-page.view-huaiwangfu .map-point:focus-visible .map-label,
  .map-page.view-huaiwangfu .map-point.selected .map-label,
  .map-page.view-zhangshiyuan .map-point:hover .map-label,
  .map-page.view-zhangshiyuan .map-point:focus-visible .map-label,
  .map-page.view-zhangshiyuan .map-point.selected .map-label {
    top: -29px;
  }

  .map-tip {
    margin-top: 12px;
    color: rgba(36,31,27,0.62);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.7;
  }

  .info-card {
    min-height: 280px;
    border: 1px solid rgba(36,31,27,0.30);
    background:
      linear-gradient(180deg, rgba(251,243,228,0.82), rgba(239,232,216,0.72));
    box-shadow: var(--shadow);
    padding: 20px;
    position: sticky;
    top: 24px;
  }

  .info-card .small {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--cinnabar);
    letter-spacing: 0.18em;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .info-card h2 {
    font-size: 28px;
    letter-spacing: 0.14em;
    color: var(--deep);
    margin-bottom: 12px;
  }

  .info-card p {
    font-size: 15px;
    line-height: 1.85;
    color: rgba(36,31,27,0.82);
    text-align: justify;
  }

  .related-ocs {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(36,31,27,0.14);
  }

  .related-ocs-title {
    margin-bottom: 10px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: rgba(136,58,30,0.82);
  }

  .oc-list {
    display: grid;
    gap: 9px;
  }

  .oc-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 9px;
    border: 1px solid rgba(36,31,27,0.18);
    background: rgba(255,250,240,0.58);
    color: var(--ink);
    transition: 0.18s ease;
  }

  .oc-card:hover {
    transform: translateY(-1px);
    border-color: rgba(136,58,30,0.34);
    background: rgba(136,58,30,0.08);
    color: var(--cinnabar);
  }

  .oc-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(36,31,27,0.22);
    background: rgba(239,232,216,0.8);
    flex: 0 0 auto;
  }

  .oc-name {
    font-family: "Songti SC", "STSong", serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  .oc-note {
    display: block;
    margin-top: 1px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: rgba(36,31,27,0.54);
  }

  .info-card .path {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid rgba(36,31,27,0.18);
    color: rgba(36,31,27,0.56);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    line-height: 1.6;
  }

  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    color: rgba(36,31,27,0.62);
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend span::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid rgba(239,232,216,0.94);
    box-shadow: 0 0 0 4px rgba(49,84,68,0.13);
  }

  .legend .enter-dot::before {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: #9d2418;
    box-shadow: 0 0 0 4px rgba(157,36,24,0.20);
    transform: rotate(45deg);
  }

  @media (max-width: 860px) {
    body {
      padding: 16px;
    }

    .topbar {
      align-items: flex-start;
      flex-direction: column;
    }

    .nav-actions {
      justify-content: flex-start;
    }

    .map-layout {
      grid-template-columns: 1fr;
    }

    .info-card {
      position: relative;
      top: auto;
      min-height: auto;
    }
  }

  @media (max-width: 680px) {
    .map-page {
      width: 100%;
      padding-top: 12px;
    }

    h1 {
      font-size: 30px;
    }

    .map-shell {
      padding: 10px;
    }

    .map-stage {
      aspect-ratio: 4 / 3;
    }

    .map-label {
      top: -30px;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 2px 6px;
    }

    .map-point:hover .map-label,
    .map-point:focus-visible .map-label,
    .map-point.selected .map-label {
      top: -33px;
    }

    .map-page.view-huai .map-label,
    .map-page.view-yan .map-label,
    .map-page.view-shuo .map-label,
    .map-page.view-zhushan .map-label,
    .map-page.view-huaijun .map-label,
    .map-page.view-huaiwangfu .map-label,
    .map-page.view-zhangshiyuan .map-label {
      font-size: 8px;
      letter-spacing: 0.02em;
      padding: 1px 4px;
      top: -22px;
    }

    .map-page.view-huai .map-point:hover .map-label,
    .map-page.view-huai .map-point:focus-visible .map-label,
    .map-page.view-huai .map-point.selected .map-label,
    .map-page.view-yan .map-point:hover .map-label,
    .map-page.view-yan .map-point:focus-visible .map-label,
    .map-page.view-yan .map-point.selected .map-label,
    .map-page.view-shuo .map-point:hover .map-label,
    .map-page.view-shuo .map-point:focus-visible .map-label,
    .map-page.view-shuo .map-point.selected .map-label,
    .map-page.view-zhushan .map-point:hover .map-label,
    .map-page.view-zhushan .map-point:focus-visible .map-label,
    .map-page.view-zhushan .map-point.selected .map-label,
    .map-page.view-huaijun .map-point:hover .map-label,
    .map-page.view-huaijun .map-point:focus-visible .map-label,
    .map-page.view-huaijun .map-point.selected .map-label,
    .map-page.view-huaiwangfu .map-point:hover .map-label,
    .map-page.view-huaiwangfu .map-point:focus-visible .map-label,
    .map-page.view-huaiwangfu .map-point.selected .map-label,
    .map-page.view-zhangshiyuan .map-point:hover .map-label,
    .map-page.view-zhangshiyuan .map-point:focus-visible .map-label,
    .map-page.view-zhangshiyuan .map-point.selected .map-label {
      top: -25px;
    }

    .point-bubble {
      left: 24px;
      bottom: -14px;
      width: 160px;
      padding: 5px;
    }

    .point-bubble.bubble-left {
      right: 24px;
      bottom: -14px;
    }

    .point-bubble::after,
    .point-bubble.bubble-left::after {
      bottom: 14px;
    }

    .map-point::before {
      width: 12px;
      height: 12px;
    }

    .map-point.enter::before {
      width: 16px;
      height: 16px;
    }

    .info-card h2 {
      font-size: 24px;
    }

    .oc-avatar {
      width: 32px;
      height: 32px;
    }

    .oc-name {
      font-size: 15px;
    }
  }
  /* 与人物志、记闻统一的页面外观 */
  @font-face {
    font-family: Zhaohua;
    src: url("./fonts/hgx314zt77rT4VM7jffeaVGmA.ttf") format("truetype");
    font-display: swap;
  }

  @font-face {
    font-family: SourceHan;
    src: url("./fonts/hief7Umr6mqzKUO37He3NcwPo14.otf") format("opentype");
    font-display: swap;
  }

  @font-face {
    font-family: Qiji;
    src: url("./fonts/cRlCeCBTN82rySwblecgchyzq4I.ttf") format("truetype");
    font-display: swap;
  }

  :root {
    --page: #ebdfda;
    --banner: #8a7d70;
    --panel: rgba(217, 205, 202, .72);
    --card: rgba(255, 255, 255, .60);
    --card-hover: rgba(255, 255, 255, .78);
    --ink: #685d53;
    --deep: #685d53;
    --cinnabar: #8a7d70;
    --green: #8a7d70;
    --paper: #ebdfda;
    --line: rgba(104, 93, 83, .34);
    --muted: rgba(105, 94, 84, .72);
    --shadow: 0 18px 48px rgba(71, 61, 49, .10);
    --display: Qiji, Zhaohua, "STKaiti", serif;
  }

  html { background: var(--page); }

  body {
    margin: 0;
    padding: 0;
    background: var(--page);
    color: var(--ink);
    font-family: SourceHan, "Songti SC", serif;
  }

  body::before { display: none; }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 500;
    height: 62px;
    padding: 0 102px;
    display: flex;
    align-items: center;
    background: var(--banner);
    border-bottom: 1px solid rgba(71, 61, 49, .22);
  }

  .site-nav {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 48px;
    margin-right: auto;
  }

  .site-nav a {
    color: #fff;
    white-space: nowrap;
    font: 400 22px/1 Zhaohua, SourceHan, serif;
    transition: opacity .2s ease, transform .2s ease;
  }

  .site-nav a:hover,
  .site-nav a:focus-visible {
    opacity: .76;
    transform: scale(1.06);
  }

  .account {
    position: relative;
    width: 40px;
    height: 40px;
    color: transparent;
    font-size: 0;
    transition: opacity .2s ease, transform .2s ease;
  }

  .account::before,
  .account::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border: 3px solid #fff;
  }

  .account::before {
    top: 4px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .account::after {
    bottom: 4px;
    width: 24px;
    height: 12px;
    border-radius: 18px 18px 4px 4px;
  }

  .account:hover,
  .account:focus-visible { opacity: .76; transform: scale(1.06); }

  .menu-toggle { display: none; }

  .map-page {
    width: min(1210px, calc(100% - 64px));
    margin: 44px auto 56px;
    padding: clamp(42px, 5vw, 64px);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: var(--shadow);
  }

  .topbar { margin-bottom: 32px; }
  .page-heading { width: max-content; max-width: 100%; margin: 0; }
  .page-heading h1 { margin: 0; color: var(--ink); font: 400 clamp(45px, 5vw, 68px)/1.1 var(--display); letter-spacing: .04em; }

      <h2>${view.title}</h2>
      <p>悬停或点击地点查看简介。</p>
      <div class="path">当前层级：${view.path}</div>
    `;
  }

  function clearSelectedPoint() {
    document.querySelectorAll(".map-point").forEach((point) => {
      point.classList.remove("selected");
    });
  }

  function renderBubble(point) {
    if (!point.bubble || !point.bubble.image) {
      return "";
    }

    const positionClass = point.bubble.position || "";

    return `
      <span class="point-bubble ${positionClass}" aria-hidden="true">
        <img src="${point.bubble.image}" alt="${point.bubble.alt || point.name}">
      </span>
    `;
  }

  function renderPoints(view) {
    pointsLayer.innerHTML = "";

    view.points.forEach((point) => {
      const btn = document.createElement("button");
      btn.className = `map-point ${point.type}${point.bubble ? " has-bubble" : ""}`;
      btn.type = "button";
      btn.style.setProperty("--x", point.x);
      btn.style.setProperty("--y", point.y);
      btn.setAttribute("aria-label", point.name);

      btn.innerHTML = `
        <span class="map-label">${point.name}</span>
        ${renderBubble(point)}
      `;

      btn.addEventListener("mouseenter", () => {
        if (!isTouchDevice) {
          showInfo(point);
        }
      });

      btn.addEventListener("focus", () => showInfo(point));

      btn.addEventListener("click", () => {
        showInfo(point);

        const pointKey = `${currentView}-${point.name}`;

        clearSelectedPoint();
        btn.classList.add("selected");

        if (point.type !== "enter" || !point.target) {
          selectedPointKey = pointKey;
          return;
        }

        if (isTouchDevice) {
          if (selectedPointKey !== pointKey) {
            selectedPointKey = pointKey;
            return;
          }
        }

        selectedPointKey = pointKey;
        enterPoint(point);
      });

      pointsLayer.appendChild(btn);
    });
  }

  function enterPoint(point) {
    if (point.enterMode === "image") {
      switchImageView(point.target, true);
    } else {
      showZoomView(point.target, true);
    }
  }

  function showZoomView(viewName, pushHistory = true) {
    const view = views[viewName];
    if (!view) return;

    selectedPointKey = null;

    if (pushHistory && currentView !== viewName) {
      historyStack.push(currentView);
    }

    currentView = viewName;
    setViewClass(viewName);
    mapTitle.textContent = view.title;
    pointsLayer.innerHTML = "";

    if (mapImage.src !== view.image) {
      mapImage.src = view.image;
    }

    mapLayer.classList.add("zooming");
    mapLayer.style.transform = view.transform;

    setTimeout(() => {
      mapLayer.classList.remove("zooming");
      renderPoints(view);
      showViewInfo(view);
    }, 520);
  }

  function switchImageView(viewName, pushHistory = true) {
    const view = views[viewName];
    if (!view) return;

    selectedPointKey = null;

    if (pushHistory && currentView !== viewName) {
      historyStack.push(currentView);
    }

    currentView = viewName;
    setViewClass(viewName);
    mapTitle.textContent = view.title;
    pointsLayer.innerHTML = "";
    mapLayer.classList.add("fading");

    setTimeout(() => {
      mapImage.src = view.image;
      mapImage.alt = view.title;
      mapLayer.style.transform = view.transform;

      renderPoints(view);
      showViewInfo(view);

      requestAnimationFrame(() => {
        mapLayer.classList.remove("fading");
      });
    }, 280);
  }

  function loadView(viewName, pushHistory = true) {
    const view = views[viewName];
    if (!view) return;

    if (view.image === WORLD_MAP) {
      showZoomView(viewName, pushHistory);
    } else {
      switchImageView(viewName, pushHistory);
    }
  }

  function goBack() {
    selectedPointKey = null;
    const previous = historyStack.pop();

    if (!previous) {
      loadView("world", false);
      return;
    }

    loadView(previous, false);
  }

  function goWorld() {
    selectedPointKey = null;
    historyStack = [];
    currentView = "world";
    setViewClass("world");

    const view = views.world;

    mapTitle.textContent = view.title;
    pointsLayer.innerHTML = "";
    mapLayer.classList.add("fading");

    setTimeout(() => {
      mapImage.src = view.image;
      mapImage.alt = view.title;
      mapLayer.style.transform = view.transform;
      renderPoints(view);
      showViewInfo(view);

      requestAnimationFrame(() => {
        mapLayer.classList.remove("fading");
      });
    }, 220);
  }

  backBtn.addEventListener("click", goBack);
  worldBtn.addEventListener("click", goWorld);

  renderPoints(views.world);
  showViewInfo(views.world);
</script>
</body>
</html>
