<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="四方记闻目录">
  <title>四方 · 记闻</title>

  <style>
    @font-face {
      font-family: Zhaohua;
      src: url("../fonts/hgx314zt77rT4VM7jffeaVGmA.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: Qiji;
      src: url("../fonts/cRlCeCBTN82rySwblecgchyzq4I.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: SourceHan;
      src: url("../fonts/hief7Umr6mqzKUO37He3NcwPo14.otf") format("opentype");
      font-display: swap;
    }

    :root {
      --page: #ebdfda;
      --banner: #8a7d70;
      --panel: rgba(217, 205, 202, .72);
      --card: rgba(255, 255, 255, .60);
      --card-hover: rgba(255, 255, 255, .78);
      --ink: #685d53;
      --muted: rgba(105, 94, 84, .72);
      --line: rgba(104, 93, 83, .34);
      --node: #8a7d70;
      --shadow: rgba(71, 61, 49, .10);
      --serif: SourceHan, "Songti SC", "Noto Serif CJK SC", serif;
      --display: Qiji, Zhaohua, "STKaiti", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--page);
      font-family: var(--serif);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 62px;
      padding: 0 102px;
      display: flex;
      align-items: center;
      background: var(--banner);
      border-bottom: 1px solid rgba(71, 61, 49, .22);
    }

    .site-nav {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 48px;
      margin-right: auto;
    }

    .site-nav a {
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      font: 400 22px/1 Zhaohua, var(--serif);
      transition: opacity .2s ease, transform .2s ease;
    }

    .site-nav a:hover,
    .site-nav a:focus-visible {
      opacity: .76;
      transform: scale(1.06);
    }

    .account {
      position: relative;
      width: 40px;
      height: 40px;
      color: transparent;
      font-size: 0;
      text-decoration: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .account::before,
    .account::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 3px solid #fff;
    }

    .account::before {
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .account::after {
      bottom: 4px;
      width: 24px;
      height: 12px;
      border-radius: 18px 18px 4px 4px;
    }

    .account:hover,
    .account:focus-visible {
      opacity: .76;
      transform: scale(1.06);
    }

    .menu-toggle {
      display: none;
    }

    .page-shell {
      width: min(1210px, calc(100% - 64px));
      min-height: calc(100vh - 176px);
      margin: 44px auto 56px;
      padding: clamp(54px, 6vw, 78px);
      border-radius: 12px;
      background:
        linear-gradient(var(--panel), var(--panel)),
        repeating-linear-gradient(135deg, transparent 0 23px, rgba(255, 255, 255, .08) 24px 25px);
      box-shadow: 0 18px 48px var(--shadow);
    }

    .page-heading {
      width: max-content;
      max-width: 100%;
      margin: 0 0 42px;
    }

    .page-heading h1 {
      margin: 0;
      color: var(--ink);
      font: 400 clamp(45px, 5vw, 68px)/1.1 var(--display);
      letter-spacing: .04em;
    }

    .heading-line {
      width: 100%;
      height: 2px;
      margin: 12px 0 13px;
      background: var(--line);
    }

    .page-heading p {
      margin: 0;
      color: var(--muted);
      font: 18px/1.2 Georgia, serif;
      letter-spacing: .12em;
    }

    .timeline {
      position: relative;
      padding: 8px 0 10px 92px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 10px;
      bottom: 12px;
      left: 37px;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--line) 7%, var(--line) 93%, transparent);
    }

    .story-entry {
      position: relative;
      min-height: 88px;
      margin-bottom: 22px;
      padding: 18px 22px 18px 26px;
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      border-radius: 4px;
      background: var(--card);
      box-shadow: 0 8px 20px rgba(71, 61, 49, .055);
      transition: transform .2s ease, background-color .2s ease, box-shadow .2s ease;
    }

    .story-entry:last-child {
      margin-bottom: 0;
    }

    .story-entry::before {
      content: "";
      position: absolute;
      left: -61px;
      top: 50%;
      width: 13px;
      height: 13px;
      border: 4px solid var(--panel);
      border-radius: 50%;
      background: var(--node);
      box-shadow: 0 0 0 1px rgba(104, 93, 83, .28);
      transform: translateY(-50%);
    }

    .story-entry::after {
      content: "";
      position: absolute;
      left: -44px;
      top: 50%;
      width: 44px;
      height: 1px;
      background: var(--line);
    }

    .story-entry:hover,
    .story-entry:focus-within {
      transform: translateX(4px);
      background: var(--card-hover);
      box-shadow: 0 12px 28px rgba(71, 61, 49, .11);
    }

    .story-year {
      color: var(--muted);
      font-size: 16px;
      white-space: nowrap;
    }

    .story-title {
      min-width: 0;
      margin: 0;
      color: var(--ink);
      font: 400 31px/1.2 Zhaohua, var(--serif);
      letter-spacing: .04em;
    }

    .story-link {
      min-width: 108px;
      padding: 8px 18px;
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 20px;
      background: var(--banner);
      font-size: 14px;
      transition: opacity .2s ease, transform .2s ease;
    }

    .story-link:hover,
    .story-link:focus-visible {
      opacity: .78;
      transform: scale(1.04);
      outline: none;
    }

    @media (max-width: 1100px) {
      .site-header {
        padding-inline: 34px;
      }

      .site-nav {
        gap: 30px;
      }

      .site-nav a {
        font-size: 21px;
      }

      .page-shell {
        width: min(880px, calc(100% - 40px));
        padding: 58px;
      }

      .story-entry {
        grid-template-columns: 112px minmax(0, 1fr) auto;
      }
    }

    @media (max-width: 760px) {
      .site-header {
        height: 62px;
        padding-inline: 18px;
        justify-content: space-between;
      }

      .site-nav {
        display: none;
        position: absolute;
        top: 62px;
        left: 0;
        right: 0;
        height: auto;
        padding: 10px 18px 16px;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        background: rgba(138, 125, 112, .98);
        box-shadow: 0 12px 24px rgba(71, 61, 49, .14);
      }

      .site-nav.is-open {
        display: flex;
      }

      .site-nav a {
        width: 100%;
        padding: 12px 14px;
        font-size: 20px;
        text-align: left;
      }

      .menu-toggle {
        width: 40px;
        height: 40px;
        padding: 9px 7px;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .menu-toggle span {
        width: 100%;
        height: 2px;
        display: block;
        border-radius: 2px;
        background: #fff;
        transform-origin: center;
        transition: transform .2s ease, opacity .2s ease;
      }

      .menu-toggle.is-open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }

      .menu-toggle.is-open span:nth-child(2) {
        opacity: 0;
      }

      .menu-toggle.is-open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }

      .page-shell {
        width: calc(100% - 24px);
        margin-block: 20px 28px;
        padding: 38px 24px 44px;
      }

      .page-heading {
        margin-bottom: 34px;
      }

      .timeline {
        padding-left: 46px;
      }

      .timeline::before {
        left: 14px;
      }

      .story-entry {
        padding: 18px 18px;
        grid-template-columns: 1fr auto;
        gap: 8px 14px;
      }

      .story-entry::before {
        left: -39px;
      }

      .story-entry::after {
        left: -22px;
        width: 22px;
      }

      .story-year {
        grid-column: 1 / -1;
        font-size: 14px;
      }

      .story-title {
        font-size: 25px;
      }

      .story-link {
        min-width: auto;
        padding-inline: 14px;
      }
    }

    @media (max-width: 480px) {
      .page-shell {
        width: 100%;
        margin: 0;
        padding: 34px 15px 42px;
        border-radius: 0;
        box-shadow: none;
      }

      .page-heading h1 {
        font-size: 42px;
      }

      .page-heading p {
        font-size: 15px;
      }

      .timeline {
        padding-left: 35px;
      }

      .timeline::before {
        left: 10px;
      }

      .story-entry::before {
        left: -32px;
      }

      .story-entry::after {
        left: -15px;
        width: 15px;
      }

      .story-title {
        font-size: 22px;
      }

      .story-link {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="打开导航菜单">
      <span></span><span></span><span></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="主导航">
      <a href="../index.html">主页</a>
      <a href="../characters/index.html">人物志</a>
      <a href="./index.html" aria-current="page">记闻</a>
      <a href="../map.html">地图</a>
      <a href="../timeline.html">时间线</a>
      <a href="../fanfic.html">杂谈</a>
    </nav>

    <a class="account" href="../user.html" aria-label="泥的用户中心">泥</a>
  </header>

  <main class="page-shell">
    <header class="page-heading">
      <h1>四方·记闻</h1>
      <div class="heading-line" aria-hidden="true"></div>
      <p>Stories</p>
    </header>

    <section class="timeline" aria-label="记闻时间线">
      <article class="story-entry">
        <time class="story-year" datetime="0012">固元十二年</time>
        <h2 class="story-title">朔风向淮</h2>
        <a class="story-link" href="./shuofengxianghuai.html">查看正文</a>
      </article>

      <article class="story-entry">
        <time class="story-year" datetime="0017">固元十七年</time>
        <h2 class="story-title">归去来</h2>
        <a class="story-link" href="./story2.html">查看正文</a>
      </article>

      <article class="story-entry">
        <time class="story-year" datetime="0018">固元十八年</time>
        <h2 class="story-title">碎玉</h2>
        <a class="story-link" href="./story3.html">查看正文</a>
      </article>

      <article class="story-entry">
        <time class="story-year" datetime="0020">固元二十年</time>
        <h2 class="story-title">离章</h2>
        <a class="story-link" href="./story4.html">查看正文</a>
      </article>
    </section>
  </main>

  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const siteNav = document.querySelector(".site-nav");

    menuButton.addEventListener("click", () => {
      const isOpen = siteNav.classList.toggle("is-open");
      menuButton.classList.toggle("is-open", isOpen);
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute("aria-label", isOpen ? "关闭导航菜单" : "打开导航菜单");
    });

    siteNav.addEventListener("click", event => {
      if (event.target.closest("a") && window.innerWidth <= 760) {
        siteNav.classList.remove("is-open");
        menuButton.classList.remove("is-open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "打开导航菜单");
      }
    });
  </script>
</body>
</html>
