<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="四方人物志">
  <title>四方 · 人物志</title>

  <style>
    @font-face {
      font-family: Zhaohua;
      src: url("../fonts/hgx314zt77rT4VM7jffeaVGmA.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: Qiji;
      src: url("../fonts/cRlCeCBTN82rySwblecgchyzq4I.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: SourceHan;
      src: url("../fonts/hief7Umr6mqzKUO37He3NcwPo14.otf") format("opentype");
      font-display: swap;
    }

    :root {
      --page: #ebdfda;
      --banner: #8a7d70;
      --panel: rgba(217, 205, 202, .72);
      --card: rgba(255, 255, 255, .82);
      --ink: #685d53;
      --muted: rgba(105, 94, 84, .72);
      --line: rgba(104, 93, 83, .38);
      --shadow: rgba(71, 61, 49, .10);
      --serif: SourceHan, "Songti SC", "Noto Serif CJK SC", serif;
      --display: Qiji, Zhaohua, "STKaiti", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--page);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--page);
      font-family: var(--serif);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 76px;
      padding: 0 clamp(28px, 6vw, 96px);
      display: flex;
      align-items: center;
      background: var(--banner);
      border-bottom: 1px solid rgba(71, 61, 49, .22);
    }

    .site-nav {
      height: 100%;
      display: flex;
      align-items: center;
      gap: clamp(28px, 4vw, 62px);
      margin-right: auto;
    }

    .site-nav a {
      position: relative;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      font: 400 24px/1 Zhaohua, var(--serif);
      transition: opacity .2s ease, transform .2s ease;
    }

    .site-nav a:hover,
    .site-nav a:focus-visible {
      opacity: .76;
      transform: scale(1.06);
    }

    .account {
      position: relative;
      width: 40px;
      height: 40px;
      color: #fff;
      font-size: 0;
      text-decoration: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .account::before,
    .account::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border: 3px solid #fff;
    }

    .account::before {
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .account::after {
      bottom: 4px;
      width: 24px;
      height: 12px;
      border-radius: 18px 18px 4px 4px;
    }

    .account:hover,
    .account:focus-visible {
      opacity: .76;
      transform: scale(1.06);
    }

    .menu-toggle {
      display: none;
    }

    .page-shell {
      width: min(1210px, calc(100% - 64px));
      min-height: calc(100vh - 136px);
      margin: 44px auto 56px;
      padding: clamp(54px, 6vw, 78px);
      border-radius: 12px;
      background:
        linear-gradient(rgba(217, 205, 202, .72), rgba(217, 205, 202, .72)),
        repeating-linear-gradient(135deg, transparent 0 23px, rgba(255, 255, 255, .08) 24px 25px);
      box-shadow: 0 18px 48px var(--shadow);
    }

    .page-heading {
      width: max-content;
      max-width: 100%;
      margin: 0 0 58px;
    }

    .page-heading h1 {
      margin: 0;
      color: var(--ink);
      font: 400 clamp(45px, 5vw, 68px)/1.1 var(--display);
      letter-spacing: .04em;
    }

    .heading-line {
      width: 100%;
      height: 2px;
      margin: 12px 0 13px;
      background: var(--line);
    }

    .page-heading p {
      margin: 0;
      color: var(--muted);
      font: 18px/1.2 Georgia, serif;
      letter-spacing: .12em;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px 28px;
    }

    .character-card {
      min-width: 0;
      height: 92px;
      padding: 8px 20px 8px 8px;
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      align-items: center;
      color: var(--ink);
      text-decoration: none;
      border-radius: 48px;
      background: var(--card);
      box-shadow: 0 8px 18px rgba(71, 61, 49, .055);
      transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
    }

    .character-card:hover,
    .character-card:focus-visible {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 13px 24px rgba(71, 61, 49, .12);
      outline: none;
    }

    .character-card img {
      width: 76px;
      height: 76px;
      display: block;
      object-fit: cover;
      border-radius: 50%;
    }

    .card-copy {
      min-width: 0;
      padding-left: 16px;
      text-align: center;
    }

    .card-copy strong,
    .card-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-copy strong {
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(104, 93, 83, .27);
      font-size: 18px;
      font-weight: 400;
    }

    .card-copy span {
      padding-top: 5px;
      color: var(--muted);
      font-size: 15px;
    }

    @media (max-width: 1100px) {
      .site-header {
        padding-inline: 34px;
      }

      .site-nav {
        gap: 30px;
      }

      .site-nav a {
        font-size: 21px;
      }

      .page-shell {
        width: min(880px, calc(100% - 40px));
        padding: 58px;
      }

      .character-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .site-header {
        height: 62px;
        padding-inline: 18px;
        justify-content: space-between;
      }

      .site-nav {
        display: none;
        position: absolute;
        top: 62px;
        left: 0;
        right: 0;
        height: auto;
        padding: 10px 18px 16px;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        background: rgba(138, 125, 112, .98);
        box-shadow: 0 12px 24px rgba(71, 61, 49, .14);
      }

      .site-nav.is-open {
        display: flex;
      }

      .site-nav a {
        width: 100%;
        padding: 12px 14px;
        font-size: 20px;
        text-align: left;
      }

      .menu-toggle {
        width: 40px;
        height: 40px;
        padding: 9px 7px;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .menu-toggle span {
        width: 100%;
        height: 2px;
        display: block;
        border-radius: 2px;
        background: #fff;
        transform-origin: center;
        transition: transform .2s ease, opacity .2s ease;
      }

      .menu-toggle.is-open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }

      .menu-toggle.is-open span:nth-child(2) {
        opacity: 0;
      }

      .menu-toggle.is-open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }

      .page-shell {
        width: calc(100% - 24px);
        margin-block: 20px 28px;
        padding: 38px 24px 44px;
      }

      .page-heading {
        margin-bottom: 38px;
      }

      .character-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
    }

    @media (max-width: 480px) {
      .page-shell {
        width: 100%;
        margin: 0;
        border-radius: 0;
        padding: 34px 18px 42px;
        box-shadow: none;
      }

      .page-heading h1 {
        font-size: 42px;
      }

      .page-heading p {
        font-size: 15px;
      }

      .character-grid {
        grid-template-columns: 1fr;
      }

      .character-card {
        height: 86px;
        grid-template-columns: 70px minmax(0, 1fr);
      }

      .character-card img {
        width: 70px;
        height: 70px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="打开导航菜单">
      <span></span><span></span><span></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="主导航">
      <a href="../index.html">主页</a>
      <a href="./index.html" aria-current="page">人物志</a>
      <a href="../story/index.html">记闻</a>
      <a href="../map.html">地图</a>
      <a href="../timeline.html">时间线</a>
      <a href="../fanfic.html">杂谈</a>
    </nav>

    <a class="account" href="../user.html" aria-label="泥的用户中心">泥</a>
  </header>

  <main class="page-shell">
    <header class="page-heading">
      <h1>四方·人物志</h1>
      <div class="heading-line" aria-hidden="true"></div>
      <p>characters</p>
    </header>

    <section class="character-grid" aria-label="角色列表">
      <a class="character-card" href="./zhengqihua/index.html">
        <img src="./zhengqihua/assets/images/avatar.png" alt="郑麒华头像">
        <span class="card-copy"><strong>郑麒华</strong><span>「元锦」</span></span>
      </a>

      <a class="character-card" href="./zhenglinshu/index.html">
        <img src="./zhenglinshu/assets/images/avatar.png" alt="郑麟书头像">
        <span class="card-copy"><strong>郑麟书</strong><span>「文尧」</span></span>
      </a>

      <a class="character-card" href="./zhongyue/index.html">
        <img src="./zhongyue/assets/images/avatar.png" alt="钟月头像">
        <span class="card-copy"><strong>钟月</strong><span>「上弦」</span></span>
      </a>

      <a class="character-card" href="./jiangxuan/index.html">
        <img src="./jiangxuan/assets/images/avatar.png" alt="姜玄头像">
        <span class="card-copy"><strong>姜玄</strong><span>「子墨」</span></span>
      </a>

      <a class="character-card" href="./xinyi/index.html">
        <img src="./xinyi/assets/images/avatar.png" alt="辛夷头像">
        <span class="card-copy"><strong>辛夷</strong><span>「桑若」</span></span>
      </a>

      <a class="character-card" href="./zhanming/index.html">
        <img src="./zhanming/assets/images/avatar.png" alt="詹明头像">
        <span class="card-copy"><strong>詹明</strong><span>「无晦」</span></span>
      </a>

      <a class="character-card" href="./qifei/index.html">
        <img src="./qifei/assets/images/avatar.png" alt="齐斐头像">
        <span class="card-copy"><strong>齐斐</strong><span>「章华」</span></span>
      </a>

      <a class="character-card" href="./qilang/index.html">
        <img src="./qilang/assets/images/avatar.png" alt="齐琅头像">
        <span class="card-copy"><strong>齐琅</strong><span>「怀石」</span></span>
      </a>

      <a class="character-card" href="./fengying/index.html">
        <img src="./fengying/assets/images/avatar.png" alt="冯瑛头像">
        <span class="card-copy"><strong>冯瑛</strong><span>「令仪」</span></span>
      </a>

      <a class="character-card" href="./qinqin/index.html">
        <img src="./qinqin/assets/images/avatar.png" alt="秦溱头像">
        <span class="card-copy"><strong>秦溱</strong><span>「子渊」</span></span>
      </a>
    </section>
  </main>

  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const siteNav = document.querySelector(".site-nav");

    menuButton.addEventListener("click", () => {
      const isOpen = siteNav.classList.toggle("is-open");
      menuButton.classList.toggle("is-open", isOpen);
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute("aria-label", isOpen ? "关闭导航菜单" : "打开导航菜单");
    });

    siteNav.addEventListener("click", event => {
      if (event.target.closest("a") && window.innerWidth <= 760) {
        siteNav.classList.remove("is-open");
        menuButton.classList.remove("is-open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "打开导航菜单");
      }
    });
  </script>
</body>
</html>
