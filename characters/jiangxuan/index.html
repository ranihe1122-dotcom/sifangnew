   /* color */

      --browser-bg: #eee;

      --banner-text: #fff;
      --banner-start: #6fa35e;
      --banner-middle: #95be88;
      --banner-end: #a2bb9a;
      --mobile-menu-bg: rgba(179, 201, 173, .98);

      --page-glow: rgba(179, 201, 173, .14);

      --profile-bg: #f0f1e8;
      --facts-bg: #f4f5f1;

      --card-bg: #fff;
      --card-translucent-bg: rgba(255, 255, 255, .78);
      --card-soft-bg: rgba(246, 248, 243, .78);

      --intro-text: #364024;

      --field-top: #b3bfa4;
      --field-bottom: #dde3d5;

      --ink: #565b54;
      --green: #718a45;
      --deep: #33451f;
      --line: #d7d9d2;

      --owner-color: #859b68;
      --relation-name: #869e61;
      --relation-arrow: #91a77c;
      --relation-line: rgba(113, 138, 69, .16);
      --relation-hover: rgba(179, 201, 173, .20);
      --relation-focus: rgba(113, 138, 69, .28);

      --banner-border: rgba(77, 94, 70, .32);
      --banner-shadow: rgba(56, 77, 44, .12);
      --soft-border: rgba(113, 138, 69, .08);
      --profile-shadow: rgba(52, 69, 40, .10);
      --facts-shadow: rgba(69, 83, 59, .045);
      --panel-shadow: rgba(52, 69, 40, .12);
      --portrait-shadow: rgba(55, 72, 44, .10);
      --card-shadow: rgba(66, 82, 55, .055);
      --menu-border: rgba(77, 94, 70, .20);
      --menu-shadow: rgba(49, 66, 39, .12);

      /* 立绘：每个角色可单独调整 */
      --portrait-position: 50% ;
      --portrait-scale: 1;
      --portrait-origin: 50% 12%;
      --portrait-position-tablet: 52.5%;
      --portrait-scale-tablet: 1;
      --portrait-origin-tablet: 50% 12%;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav"

    >

    <nav id="site-nav" class="site-nav" aria-label="主导航">

    <a

      href="../../user.html"

  <main id="top" class="page-shell">
    <aside id="profile" class="profile-card">
      <div class="avatar-wrap">
        <img
          src="./assets/images/avatar.png"
          alt="辛夷头像"
        >
      </div>

      <p class="eyebrow">CHARACTER PROFILE</p>

      <h1>· 姜玄 ·</h1>

      <dl class="facts">
        <div>
          <dt>字</dt>
          <dd>子墨</dd>
        </div>

        <div>
          <dt>阵营</dt>
          <dd>淮</dd>
        </div>

        <div>
          <dt>性别</dt>
          <dd>男</dd>
        </div>

        <div>
          <dt>年龄</dt>
          <dd>二十四</dd>
        </div>

        <div>
          <dt>生辰</dt>
          <dd>十月二十</dd>
        </div>

        <div>
          <dt>身份</dt>
          <dd>记室参军</dd>
        </div>

        <div>
          <dt>owner</dt>

          <dd>
            <a class="owner-dot" href="../../user.html" aria-label="查看泥的用户界面">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9.25"></circle>
                <circle cx="12" cy="9" r="3"></circle>
                <path

                ></path>

      </dl>
    </aside>

    <section class="character-panel">
      <div class="content-area">
        <article id="story" class="intro paper-card">
          <header>
            <span>01</span>

            <h2>人物简介</h2>

            <svg
              class="title-icon info-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="8.75"></circle>
              <path d="M12 11v5"></path>
              <circle
                class="icon-fill"
                cx="12"
                cy="7.8"
                r=".8"
              ></circle>
            </svg>
          </header>

          <p>
            <span>
              <strong>出身自烛山。</strong>
              淮郡记室参军。掌文书，才思敏捷，能言善辩，尤嗜酒。性情疏狂洒脱，不拘小节，能不动声色折人气焰，又能于酒兴诗兴之间落笔成文。
            </span>
          </p>
        </article>

        <section
          class="relations paper-card"
          aria-labelledby="relations-title"
        >
          <header>
            <span>02</span>

            <h2 id="relations-title">人物关系</h2>

            <svg
              class="title-icon heart-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 19.2 5.4 13C1.2 9.1 6.9 3.1 12 7.3 17.1 3.1 22.8 9.1 18.6 13Z"
              ></path>
            </svg>
          </header>

          <div class="relation-grid">
            <a href="../zhanming/index.html">
              <b>詹明</b>
              <small>同僚、好友</small>
            </a>

            <a href="../xinyi/index.html">
              <b>辛夷</b>

            </a>
            
            <a href="../xinyi/index.html">
              <b>郑麒华</b>
              <small>好友</small>
            </a>

          </div>
        </section>
      </div>

      <div class="portrait-area">
        <img
          class="portrait"
          src="./assets/images/portrait.png"
          alt="辛夷人物立绘"
        >
      </div>

      <footer class="panel-footer">
        <span>CHARACTERS ・ JIANG XUAN</span>
        <i></i>
      </footer>
    </section>
  </main>

  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const siteNav = document.querySelector(".site-nav");

    menuButton.addEventListener("click", () => {
      const isOpen = siteNav.classList.toggle("is-open");

      menuButton.classList.toggle("is-open", isOpen);
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute(
        "aria-label",
        isOpen ? "关闭导航菜单" : "打开导航菜单"
      );
    });

    siteNav.addEventListener("click", (event) => {
      if (event.target.closest("a") && window.innerWidth <= 900) {
        siteNav.classList.remove("is-open");
        menuButton.classList.remove("is-open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "打开导航菜单");
      }
    });
  </script>
</body>
</html>
