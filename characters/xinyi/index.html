<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="辛夷人物志">
  <title>辛夷 · 人物志</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* 当前页面配色：复制这个区块到其他页面，只改颜色即可 */
    :root {
      --browser-bg: #eee;
      --page-bg: #fff;
      --banner-bg: #b3c9ad;
      --banner-text: #fff;
      --banner-start: #afc5a8;
      --banner-middle: #b9cfb2;
      --banner-end: #afc5a8;
      --mobile-menu-bg: rgba(179, 201, 173, .98);
      --page-glow: rgba(179, 201, 173, .14);
      --profile-bg: #f0f1e8;
      --facts-bg: #f4f5f1;
      --card-bg: #fff;
      --card-translucent-bg: rgba(255, 255, 255, .78);
      --card-soft-bg: rgba(246, 248, 243, .78);
      --intro-text: #364024;
      --field-top: #b3bfa4;
      --field-bottom: #dde3d5;
      --ink: #565b54;
      --green: #718a45;
      --deep: #33451f;
      --line: #d7d9d2;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="打开导航菜单">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="主导航">
      <a href="#top">主页</a><a href="#profile">人物志</a><a href="#story">记闻</a>
      <a href="#">地图</a><a href="#">时间线</a><a href="#">杂谈</a>
    </nav>
    <button class="account" type="button" aria-label="用户中心">泥</button>
  </header>

  <main id="top" class="page-shell">
    <aside id="profile" class="profile-card">
      <div class="avatar-wrap">
        <img src="./assets/images/xinyi_avatar.png" alt="辛夷头像">
      </div>
      <p class="eyebrow">CHARACTER PROFILE</p>
      <h1>· 辛夷 ·</h1>
      <dl class="facts">
        <div><dt>原名</dt><dd>桑若</dd></div>
        <div><dt>阵营</dt><dd>淮</dd></div>
        <div><dt>性别</dt><dd>女</dd></div>
        <div><dt>年龄</dt><dd>二十</dd></div>
        <div><dt>生辰</dt><dd>九月十六</dd></div>
        <div><dt>身份</dt><dd>发明家・司工参军</dd></div>
        <div><dt>owner</dt><dd><span class="owner-dot"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25"/><circle cx="12" cy="9" r="3"/><path d="M6.8 18.2c.9-2.7 2.7-4.1 5.2-4.1s4.3 1.4 5.2 4.1"/></svg>泥</span></dd></div>
      </dl>
    </aside>

    <section class="character-panel">
      <div class="content-area">
        <article id="story" class="intro paper-card">
          <header><span>01</span><h2>人物简介</h2><svg class="title-icon info-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.75"/><path d="M12 11v5"/><circle class="icon-fill" cx="12" cy="7.8" r=".8"/></svg></header>
          <p><span><strong>出身自烛山。</strong>入淮郡境内，便以辛夷为名，于西境择一草庐而居。通晓机关之术、熟读药理与山道之法，能以非常之策化解僵局。</span></p>
        </article>

        <section class="relations paper-card" aria-labelledby="relations-title">
          <header><span>02</span><h2 id="relations-title">人物关系</h2><svg class="title-icon heart-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.2 5.4 13C1.2 9.1 6.9 3.1 12 7.3 17.1 3.1 22.8 9.1 18.6 13Z"/></svg></header>
          <div class="relation-grid">
            <article tabindex="0"><b>冯瑛</b><small>好友</small></article>
            <article tabindex="0"><b>叶栖迟</b><small>好友</small></article>
            <article tabindex="0"><b>詹明</b><small>老师、同僚</small></article>
            <article tabindex="0"><b>姜玄</b><small>同僚</small></article>
          </div>
        </section>
      </div>

      <div class="portrait-area">
        <img class="portrait" src="./assets/images/xinyi_portrait.png" alt="辛夷人物立绘">
      </div>

      <footer class="panel-footer"><span>CHARACTERS ・ XIN YI</span><i></i></footer>
    </section>
  </main>
  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const siteNav = document.querySelector(".site-nav");

    menuButton.addEventListener("click", () => {
      const isOpen = siteNav.classList.toggle("is-open");
      menuButton.classList.toggle("is-open", isOpen);
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute("aria-label", isOpen ? "关闭导航菜单" : "打开导航菜单");
    });

    siteNav.addEventListener("click", (event) => {
      if (event.target.closest("a") && window.innerWidth <= 900) {
        siteNav.classList.remove("is-open");
        menuButton.classList.remove("is-open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "打开导航菜单");
      }
    });
  </script>
</body>
</html>
