<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <!-- characters/style.css -->
  <link rel="stylesheet" href="../style.css">

  <style>
    /* color */
    :root {
      --browser-bg: #eee;
      --page-bg: #fff;

      --banner-bg: #A31212;
      --banner-text: #fff;
      --banner-start: #A31212;
      --banner-middle: #942828;
      --banner-end: #AD5050;
      --mobile-menu-bg: #A31212;

      --page-glow: rgba(201, 173, 173, 0.14);

      --profile-bg: #f1e8e8;
      --facts-bg: #f5f1f1;

      --card-bg: #fff;
      --card-translucent-bg: rgba(255, 255, 255, .78);
      --card-soft-bg: rgba(248, 243, 243, .78);

      --intro-text: #402424;

      --field-top: #bfa4a4;
      --field-bottom: #e3d5d5;

      --ink: #5b5454;
      --green: #8a4545;
      --deep: #451f1f;
      --line: #d9d2d2;

      --owner-color: #9b6868;
      --relation-name: #9e6161;
      --relation-arrow: #a77c7c;
      --relation-line: rgba(138, 69, 69, .16);
      --relation-hover: rgba(201, 173, 173, .20);
      --relation-focus: rgba(138, 69, 69, .28);

      --banner-border: rgba(94, 70, 70, .32);
      --banner-shadow: rgba(77, 44, 44, .12);
      --soft-border: rgba(138, 69, 69, .08);
      --profile-shadow: rgba(69, 40, 40, .10);
      --facts-shadow: rgba(83, 59, 59, .045);
      --panel-shadow: rgba(69, 40, 40, .12);
      --portrait-shadow: rgba(72, 44, 44, .10);
      --card-shadow: rgba(82, 55, 55, .055);
      --menu-border: rgba(94, 70, 70, .20);
      --menu-shadow: rgba(66, 39, 39, .12);

      /* 立绘位置 */
      --portrait-position: -150% -40px;
      --portrait-scale: 3;
      --portrait-origin: 50% 12%;
      --portrait-position-tablet: 45% -33px;
      --portrait-scale-tablet: 3;
      --portrait-origin-tablet: 50% 12%;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav"
      aria-label="打开导航菜单"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="主导航">
      <a href="../../index.html">主页</a>
      <a href="../index.html">人物志</a>
      <a href="../../story/index.html">记闻</a>
      <a href="../../map.html">地图</a>
      <a href="../../timeline.html">时间线</a>
      <a href="../../fanfic.html">杂谈</a>
    </nav>

    <a
      class="account"
      href="../../user.html"
      aria-label="用户中心"
    >
      泥
    </a>
  </header>

  <main id="top" class="page-shell">
    <aside id="profile" class="profile-card">
      <div class="avatar-wrap">
        <img
          src="./assets/images/avatar.png"
          alt="头像"
        >
      </div>

      <p class="eyebrow">CHARACTER PROFILE</p>

      <h1>· 郑麟书 ·</h1>

      <dl class="facts">
        <div>
          <dt>字</dt>
          <dd>文尧</dd>
        </div>

        <div>
          <dt>阵营</dt>
          <dd>淮</dd>
        </div>

        <div>
          <dt>性别</dt>
          <dd>男</dd>
        </div>

        <div>
          <dt>年龄</dt>
          <dd>二十二</dd>
        </div>

        <div>
          <dt>生辰</dt>
          <dd>二月初七</dd>
        </div>

        <div>
          <dt>身份</dt>
          <dd>校尉</dd>
        </div>

        <div>
          <dt>owner</dt>

          <dd>
            <a class="owner-dot" href="../../user.html" aria-label="查看泥的用户界面">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9.25"></circle>
                <circle cx="12" cy="9" r="3"></circle>
                <path
                  d="M6.8 18.2c.9-2.7 2.7-4.1 5.2-4.1s4.3 1.4 5.2 4.1"
                ></path>
              </svg>

              泥
            </a>
          </dd>
        </div>
      </dl>
    </aside>

    <section class="character-panel">
      <div class="content-area">
        <article id="story" class="intro paper-card">
          <header>
            <span>01</span>

            <h2>人物简介</h2>

            <svg
              class="title-icon info-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="8.75"></circle>
              <path d="M12 11v5"></path>
              <circle
                class="icon-fill"
                cx="12"
                cy="7.8"
                r=".8"
              ></circle>
            </svg>
          </header>

          <p>
            <span>
             淮国镇远将军郑昌延之子，虽不擅兵法，但有一手好戟法，性格忠厚、容易害羞。
            </span>
          </p>
        </article>

        <section
          class="relations paper-card"
          aria-labelledby="relations-title"
        >
          <header>
            <span>02</span>

            <h2 id="relations-title">人物关系</h2>

            <svg
              class="title-icon heart-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 19.2 5.4 13C1.2 9.1 6.9 3.1 12 7.3 17.1 3.1 22.8 9.1 18.6 13Z"
              ></path>
            </svg>
          </header>

          <div class="relation-grid">
            <a href="../zhengqihua/index.html">
              <b>郑麒华</b>
              <small>姐姐</small>
            </a>

            <a href="../qinqin/index.html">
              <b>秦溱</b>
              <small>同僚</small>
            </a>

          </div>
        </section>
      </div>

      <div class="portrait-area">
        <img
          class="portrait"
          src="./assets/images/portrait.png"
          alt="人物立绘"
        >
      </div>

      <footer class="panel-footer">
        <span>CHARACTERS ・ ZHENG LINSHU</span>
        <i></i>
      </footer>
    </section>
  </main>

  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const siteNav = document.querySelector(".site-nav");

    menuButton.addEventListener("click", () => {
      const isOpen = siteNav.classList.toggle("is-open");

      menuButton.classList.toggle("is-open", isOpen);
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute(
        "aria-label",
        isOpen ? "关闭导航菜单" : "打开导航菜单"
      );
    });

    siteNav.addEventListener("click", (event) => {
      if (event.target.closest("a") && window.innerWidth <= 900) {
        siteNav.classList.remove("is-open");
        menuButton.classList.remove("is-open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "打开导航菜单");
      }
    });
  </script>
</body>
</html>
