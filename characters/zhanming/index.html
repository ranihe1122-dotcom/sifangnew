<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="人物志">

  <title>人物志 · 詹明</title>

  <!-- characters/style.css -->
  <link rel="stylesheet" href="../style.css">

  <style>
    /* color */
    :root {
      --browser-bg: #eee;
      --page-bg: #fff;

      --banner-bg: #129ba3;
      --banner-text: #fff;
      --banner-start: #528a91;
      --banner-middle: #89aaab;
      --banner-end: #749f9f;
      --mobile-menu-bg: #1290a3;

      --page-glow: rgba(173, 195, 201, 0.14);

      --profile-bg: #e8eff1;
      --facts-bg: #f1f4f5;

      --card-bg: #fff;
      --card-translucent-bg: rgba(255, 255, 255, .78);
      --card-soft-bg: rgba(243, 243, 248, 0.78);

      --intro-text: #243c40;

      --field-top: #a4bfbd;
      --field-bottom: #d5e3e3;

      --ink: #545b5a;
      --green: #45898a;
      --deep: #1f4543;
      --line: #d2d8d9;

      --owner-color: #99cdcc;
      --relation-name: #619a9e;
      --relation-arrow: #7ca1a7;
      --relation-line: rgba(69, 136, 138, 0.16);
      --relation-hover: rgba(173, 201, 200, 0.2);
      --relation-focus: rgba(69, 136, 138, 0.28);

      --banner-border: rgba(70, 90, 94, 0.32);
      --banner-shadow: rgba(44, 74, 77, 0.12);
      --soft-border: rgba(69, 134, 138, 0.08);
      --profile-shadow: rgba(40, 62, 69, 0.1);
      --facts-shadow: rgba(59, 81, 83, 0.05);
      --panel-shadow: rgba(40, 68, 69, 0.12);
      --portrait-shadow: rgba(44, 71, 72, 0.1);
      --card-shadow: rgba(55, 81, 82, 0.06);
      --menu-border: rgba(70, 91, 94, 0.2);
      --menu-shadow: rgba(39, 63, 66, 0.12);

      /* 立绘位置 */
      --portrait-position: 62% 30px;
      --portrait-scale: 1.6;
      --portrait-origin: 50% 12%;
      --portrait-position-tablet: 60% 30px;
      --portrait-scale-tablet: 1.6;
      --portrait-origin-tablet: 50% 12%;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav"
      aria-label="打开导航菜单"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="主导航">
      <a href="../../index.html">主页</a>
      <a href="../index.html">人物志</a>
      <a href="../../story/index.html">记闻</a>
      <a href="../../map.html">地图</a>
      <a href="../../timeline.html">时间线</a>
      <a href="../../fanfic.html">杂谈</a>
    </nav>

    <a
      class="account"
      href="../../user.html"
      aria-label="用户中心"
    >
      泥
    </a>
  </header>

  <main id="top" class="page-shell">
    <aside id="profile" class="profile-card">
      <div class="avatar-wrap">
        <img
          src="./assets/images/avatar.png"
          alt="头像"
        >
      </div>

      <p class="eyebrow">CHARACTER PROFILE</p>

      <h1>· 詹明 ·</h1>

      <dl class="facts">
        <div>
          <dt>字</dt>
          <dd>无晦</dd>
        </div>

        <div>
          <dt>阵营</dt>
          <dd>淮</dd>
        </div>

        <div>
          <dt>性别</dt>
          <dd>男</dd>
        </div>

        <div>
          <dt>年龄</dt>
          <dd>二十七</dd>
        </div>

        <div>
          <dt>生辰</dt>
          <dd>腊月十九</dd>
        </div>

        <div>
          <dt>身份</dt>
          <dd>长史</dd>
        </div>

        <div>
          <dt>owner</dt>

          <dd>
            <a class="owner-dot" href="../../user.html" aria-label="查看泥的用户界面">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9.25"></circle>
                <circle cx="12" cy="9" r="3"></circle>
                <path
                  d="M6.8 18.2c.9-2.7 2.7-4.1 5.2-4.1s4.3 1.4 5.2 4.1"
                ></path>
              </svg>

              泥
            </a>
          </dd>
        </div>
      </dl>
    </aside>

    <section class="character-panel">
      <div class="content-area">
        <article id="story" class="intro paper-card">
          <header>
            <span>01</span>

            <h2>人物简介</h2>

            <svg
              class="title-icon info-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="8.75"></circle>
              <path d="M12 11v5"></path>
              <circle
                class="icon-fill"
                cx="12"
                cy="7.8"
                r=".8"
              ></circle>
            </svg>
          </header>

          <p>
            <span>
            出身自旧族。入淮郡境内，被淮王齐临川招揽，委以重任，后辅佐世子齐斐，教导其诗文策略。 长于政略、人心与后手，温润儒雅，思虑周全，行事少有错处。
            </span>
          </p>
        </article>

        <section
          class="relations paper-card"
          aria-labelledby="relations-title"
        >
          <header>
            <span>02</span>

            <h2 id="relations-title">人物关系</h2>

            <svg
              class="title-icon heart-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 19.2 5.4 13C1.2 9.1 6.9 3.1 12 7.3 17.1 3.1 22.8 9.1 18.6 13Z"
              ></path>
            </svg>
          </header>

          <div class="relation-grid">
            <a href="../xinyi/index.html">
              <b>辛夷</b>
              <small>同僚、学生</small>
            </a>

            <a href="../jiangxuan/index.html">
              <b>姜玄</b>
              <small>同僚</small>
            </a>
            
            <a href="../qifei/index.html">
              <b>齐斐</b>
              <small>学生</small>
            </a>
            
            <a href="../qilang/index.html">
              <b>齐琅</b>
              <small>学生</small>
            </a>

          </div>
        </section>
      </div>

      <div class="portrait-area">
        <img
          class="portrait"
          src="./assets/images/portrait.png"
          alt="人物立绘"
        >
      </div>

      <footer class="panel-footer">
        <span>CHARACTERS ・ ZHAN MING</span>
        <i></i>
      </footer>
    </section>
  </main>

  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const siteNav = document.querySelector(".site-nav");

    menuButton.addEventListener("click", () => {
      const isOpen = siteNav.classList.toggle("is-open");

      menuButton.classList.toggle("is-open", isOpen);
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute(
        "aria-label",
        isOpen ? "关闭导航菜单" : "打开导航菜单"
      );
    });

    siteNav.addEventListener("click", (event) => {
      if (event.target.closest("a") && window.innerWidth <= 900) {
        siteNav.classList.remove("is-open");
        menuButton.classList.remove("is-open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "打开导航菜单");
      }
    });
  </script>
</body>
</html>
