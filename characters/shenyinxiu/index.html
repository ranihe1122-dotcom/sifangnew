<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="人物志">

  <title>人物志 · 慎胤秀</title>

  <!-- characters/style.css -->
  <link rel="stylesheet" href="../style.css">

  <style>
    /* color */
    :root {
      --browser-bg: #eee;
      --page-bg: #fff;

      --banner-bg: #224c73;
      --banner-text: #fff;
      --banner-start: #224c73;
      --banner-middle: #224c73;
      --banner-end: #224c73;
      --mobile-menu-bg: #224c73;

      --page-glow: rgba(173, 181, 201, 0.14);

      --profile-bg: #e8ecf1;
      --facts-bg: #f1f3f5;

      --card-bg: #fff;
      --card-translucent-bg: rgba(255, 255, 255, .78);
      --card-soft-bg: rgba(248, 246, 243, 0.78);

      --intro-text: #242c40;

      --field-top: #7894b3;
      --field-bottom: #c1dbef;

      --ink: #54575b;
      --green: #4f6696;
      --deep: #1f2a45;
      --line: #d2d5d9;

      --owner-color: #68799b;
      --relation-name: #568bb5;
      --relation-arrow: #6d8bb8;
      --relation-line: rgba(69, 105, 138, 0.16);
      --relation-hover: rgba(173, 190, 201, 0.2);
      --relation-focus: rgba(69, 113, 138, 0.28);

      --banner-border: rgba(70, 78, 94, 0.32);
      --banner-shadow: rgba(44, 56, 77, 0.12);
      --soft-border: rgba(69, 108, 138, 0.08);
      --profile-shadow: rgba(40, 56, 69, 0.1);
      --facts-shadow: rgba(59, 74, 83, 0.05);
      --panel-shadow: rgba(40, 53, 69, 0.12);
      --portrait-shadow: rgba(44, 55, 72, 0.1);
      --card-shadow: rgba(55, 65, 82, 0.06);
      --menu-border: rgba(70, 82, 94, 0.2);
      --menu-shadow: rgba(39, 49, 66, 0.12);

      /* 立绘位置 */
      --portrait-position: 8px -45px;
      --portrait-scale: 2.5;
      --portrait-origin: 50% 12%;
      --portrait-position-tablet: 37% -40px;
      --portrait-scale-tablet: 2.5;
      --portrait-origin-tablet: 50% 12%;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav"
      aria-label="打开导航菜单"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="主导航">
      <a href="../../index.html">主页</a>
      <a href="../index.html">人物志</a>
      <a href="../../story/index.html">记闻</a>
      <a href="../../map.html">地图</a>
      <a href="../../timeline.html">时间线</a>
      <a href="../../fanfic.html">杂谈</a>
    </nav>

    <a
      class="account"
      href="../../user.html"
      aria-label="用户中心"
    >
      泥
    </a>
  </header>

  <main id="top" class="page-shell">
    <aside id="profile" class="profile-card">
      <div class="avatar-wrap">
        <img
          src="./assets/images/avatar.png"
          alt="头像"
        >
      </div>

      <p class="eyebrow">CHARACTER PROFILE</p>

      <h1>· 慎胤秀 ·</h1>

      <dl class="facts">


        <div>
          <dt>阵营</dt>
          <dd>无</dd>
        </div>

        <div>
          <dt>性别</dt>
          <dd>男</dd>
        </div>

        <div>
          <dt>年龄</dt>
          <dd>二十一</dd>
        </div>

        <div>
          <dt>生辰</dt>
          <dd>腊月初七</dd>
        </div>

        <div>
          <dt>身份</dt>
          <dd>贴身侍卫</dd>
        </div>

        <div>
          <dt>owner</dt>

          <dd>
            <a class="owner-dot" href="../../user.html" aria-label="查看泥的用户界面">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9.25"></circle>
                <circle cx="12" cy="9" r="3"></circle>
                <path
                  d="M6.8 18.2c.9-2.7 2.7-4.1 5.2-4.1s4.3 1.4 5.2 4.1"
                ></path>
              </svg>

              珩光花信
            </a>
          </dd>
        </div>
      </dl>
    </aside>

    <section class="character-panel">
      <div class="content-area">
        <article id="story" class="intro paper-card">
          <header>
            <span>01</span>

            <h2>人物简介</h2>

            <svg
              class="title-icon info-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="8.75"></circle>
              <path d="M12 11v5"></path>
              <circle
                class="icon-fill"
                cx="12"
                cy="7.8"
                r=".8"
              ></circle>
            </svg>
          </header>

          <p>
            <span>
           冯珵旧侍。自幼与冯珵、冯圭、冯瑛一同长大，少言寡语，行事谨慎。后随冯瑛嫁入淮郡，忠心不移，不听旁人差遣，万事以冯瑛为先。
            </span>
          </p>
        </article>

        <section
          class="relations paper-card"
          aria-labelledby="relations-title"
        >
          <header>
            <span>02</span>

            <h2 id="relations-title">人物关系</h2>

            <svg
              class="title-icon heart-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 19.2 5.4 13C1.2 9.1 6.9 3.1 12 7.3 17.1 3.1 22.8 9.1 18.6 13Z"
              ></path>
            </svg>
          </header>

          <div class="relation-grid">
            <a href="../fengying/index.html">
              <b>冯瑛</b>
              <small>主君</small>
            </a>
            
          </div>
        </section>
      </div>

      <div class="portrait-area">
        <img
          class="portrait"
          src="./assets/images/portrait.png"
          alt="人物立绘"
        >
      </div>

      <footer class="panel-footer">
        <span>CHARACTERS ・ SHEN YINXIU</span>
        <i></i>
      </footer>
    </section>
  </main>

  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const siteNav = document.querySelector(".site-nav");

    menuButton.addEventListener("click", () => {
      const isOpen = siteNav.classList.toggle("is-open");

      menuButton.classList.toggle("is-open", isOpen);
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.setAttribute(
        "aria-label",
        isOpen ? "关闭导航菜单" : "打开导航菜单"
      );
    });

    siteNav.addEventListener("click", (event) => {
      if (event.target.closest("a") && window.innerWidth <= 900) {
        siteNav.classList.remove("is-open");
        menuButton.classList.remove("is-open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "打开导航菜单");
      }
    });
  </script>
</body>
</html>
